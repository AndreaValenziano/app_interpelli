name: monitor-interpelli

on:
  schedule:
    - cron: "0 6 * * *"   # ~08:00 ora italiana (UTC+2 estate, UTC+1 inverno)
    - cron: "0 12 * * *"  # ~14:00 ora italiana
    - cron: "0 16 * * *"  # ~18:00 ora italiana
  workflow_dispatch: {}    # esecuzione manuale dal tab Actions di GitHub

permissions:
  contents: write          # necessario per il commit di interpelli_visti.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui monitor
        env:
          EMAIL_MITTENTE:     ${{ secrets.EMAIL_MITTENTE }}
          PASSWORD_EMAIL:     ${{ secrets.PASSWORD_EMAIL }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          SMTP_SERVER:        ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
        run: python3 monitor_interpelli.py

      - name: Salva stato interpelli visti
        run: |
          git config user.name  "interpelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add interpelli_visti.json
          git diff --staged --quiet || git commit -m "chore: aggiorna interpelli_visti.json [skip ci]"
          git push
