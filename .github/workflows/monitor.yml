name: monitor-interpelli

on:
  schedule:
    # Ogni ora dalle 5 alle 17 UTC (≈07–19 ora italiana): gli interpelli hanno
    # spesso scadenze a 24h, tre controlli al giorno non bastavano.
    # GitHub cron è best-effort (ritardi fino a ~15 min); repo pubblico = minuti gratuiti.
    - cron: "0 5-17 * * *"
  workflow_dispatch: {}    # esecuzione manuale dal tab Actions di GitHub

permissions:
  contents: write          # necessario per il commit di interpelli_visti.json

concurrency:
  group: monitor-interpelli
  cancel-in-progress: false  # mai due run in parallelo (push confliggenti sullo stato)

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui monitor
        env:
          EMAIL_MITTENTE:     ${{ secrets.EMAIL_MITTENTE }}
          PASSWORD_EMAIL:     ${{ secrets.PASSWORD_EMAIL }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          SMTP_SERVER:        ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
        run: python3 monitor_interpelli.py

      - name: Salva stato interpelli visti
        # if: always() NON va usato: se il monitor fallisce (es. errore SMTP) lo stato
        # non deve essere committato, così la run successiva ritenta la notifica
        run: |
          git config user.name  "interpelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add interpelli_visti.json reports/ docs/
          git diff --staged --quiet || git commit -m "chore: aggiorna stato e report interpelli [skip ci]"
          git pull --rebase origin main
          git push
