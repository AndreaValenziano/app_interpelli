name: monitor-interpelli

on:
  schedule:
    # Ogni ora dalle 5 alle 20 UTC (≈07–22 ora italiana): gli interpelli BAT escono
    # spesso verso le 17-18 e scadono la mattina dopo, la sera va coperta.
    # Minuto 17 e non 0: allo scoccare dell'ora GitHub è sovraccarico e scarta molte
    # esecuzioni (a ottobre 2026 ne partivano 2-3 al giorno su 13 programmate).
    # GitHub cron resta best-effort; repo pubblico = minuti gratuiti.
    - cron: "17 5-20 * * *"
  workflow_dispatch: {}    # esecuzione manuale dal tab Actions di GitHub

permissions:
  contents: write          # necessario per il commit di interpelli_visti.json

concurrency:
  group: monitor-interpelli
  cancel-in-progress: false  # mai due run in parallelo (push confliggenti sullo stato)

jobs:
  run:
    # Versione fissata: ubuntu-latest migra a Ubuntu 26 dal 19/10/2026
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui monitor
        id: monitor
        # Il fallimento (es. errore SMTP) non interrompe il job: report e dashboard
        # vanno comunque committati; il job viene marcato fallito nell'ultimo step
        continue-on-error: true
        env:
          EMAIL_MITTENTE:     ${{ secrets.EMAIL_MITTENTE }}
          PASSWORD_EMAIL:     ${{ secrets.PASSWORD_EMAIL }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          SMTP_SERVER:        ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
        run: python3 monitor_interpelli.py

      - name: Salva stato, report e dashboard
        # Se il monitor fallisce (es. errore SMTP) lo stato NON va committato, così la
        # run successiva ritenta la notifica; report e dashboard sì, perché gli
        # interpelli non notificati restino almeno consultabili su GitHub Pages
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: |
          git config user.name  "interpelli-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ docs/
          if [ "$MONITOR_OUTCOME" = "success" ]; then
            git add interpelli_visti.json
            messaggio="chore: aggiorna stato e report interpelli [skip ci]"
          else
            messaggio="chore: report e dashboard (notifica fallita, stato non aggiornato) [skip ci]"
          fi
          git diff --staged --quiet || git commit -m "$messaggio"
          git pull --rebase origin main
          git push

      - name: Segnala fallimento del monitor
        if: steps.monitor.outcome != 'success'
        run: |
          echo "::error::Il monitor è fallito (vedi lo step 'Esegui monitor'): stato non aggiornato, la prossima run ritenta la notifica."
          exit 1
